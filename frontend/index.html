<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C12" />

    <!--
      ─────────────────────────────────────────────────────────
      FOUC(Flash of Unstyled Content) 방지 — 테마 사전 적용
      ─────────────────────────────────────────────────────────
      React가 마운트되기 전에 동기적으로 실행되어야 한다.
      그래야 라이트 모드 사용자가 새로고침해도 다크 → 라이트 깜빡임이 없다.

      주의:
       - storage key "sync-theme-storage"는 src/lib/constants.ts의
         THEME_STORAGE_KEY 상수와 반드시 일치해야 한다.
         (Vite는 환경 변수를 HTML에 주입하지 않으므로 하드코딩)
       - theme-color 헥스는 src/index.css의 --bg, src/store/themeStore.ts의
         THEME_COLOR_MAP과 항상 일치해야 한다 (cool 팔레트: dark #0A0C12 / light #F5F7FC)
       - localStorage가 손상되거나 비어 있어도 페이지 로드는 무사해야 한다 → try/catch
       - data-theme이 적용되지 않으면 CSS의 :root 기본값(다크)이 적용됨
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("sync-theme-storage");
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var theme = parsed && parsed.state && parsed.state.theme;
          if (theme !== "light" && theme !== "dark") return;

          document.documentElement.setAttribute("data-theme", theme);

          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) {
            tc.setAttribute(
              "content",
              theme === "light" ? "#F5F7FC" : "#0A0C12"
            );
          }
        } catch (e) {
          /* 손상된 localStorage가 페이지 로드를 깨지 않게 무시 */
        }
      })();
    </script>

    <!-- Google Fonts preconnect (IBM Plex Sans + IBM Plex Mono 로딩 가속) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>EchoSync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
